# Rifle configuration for ranger
# This determines what program opens each file type when you press Enter

#-------------------------------------------
# Text files - open with neovim
#-------------------------------------------
mime ^text, label editor = nvim -- "$@"
!mime ^text, label editor, ext xml|json|csv|tex|py|pl|rb|js|sh|php|ts|lua|rs|go|java|c|cpp|h|hpp|md|rst|txt = nvim -- "$@"

#-------------------------------------------
# Websites
#-------------------------------------------
ext x?html?, has firefox, X, flag f = firefox -- "$@"
ext x?html?, has chromium, X, flag f = chromium -- "$@"

#-------------------------------------------
# PDF and documents
#-------------------------------------------
ext pdf, has zathura, X, flag f = zathura -- "$@"
ext pdf, has evince, X, flag f = evince -- "$@"
ext pdf, has okular, X, flag f = okular -- "$@"

ext docx?, has libreoffice, X, flag f = libreoffice "$@"
ext xlsx?, has libreoffice, X, flag f = libreoffice "$@"
ext pptx?, has libreoffice, X, flag f = libreoffice "$@"

#-------------------------------------------
# Images
#-------------------------------------------
mime ^image, has sxiv, X, flag f = sxiv -- "$@"
mime ^image, has feh, X, flag f = feh -- "$@"
mime ^image, has imv, X, flag f = imv -- "$@"

#-------------------------------------------
# Video
#-------------------------------------------
mime ^video, has mpv, X, flag f = mpv -- "$@"
mime ^video, has vlc, X, flag f = vlc -- "$@"

#-------------------------------------------
# Audio
#-------------------------------------------
mime ^audio, has mpv, X, flag f = mpv -- "$@"
mime ^audio, has vlc, X, flag f = vlc -- "$@"

#-------------------------------------------
# Archives
#-------------------------------------------
ext 7z|ace|ar|arc|bz2?|cab|cpio|cpt|deb|dgc|dmg|gz, has atool = atool --list -- "$@" | "$PAGER"
ext iso|jar|msi|pkg|rar|shar|tar|tgz|xar|xpi|xz|zip, has atool = atool --list -- "$@" | "$PAGER"
ext 7z|ace|ar|arc|bz2?|cab|cpio|cpt|deb|dgc|dmg|gz, has atool = atool --extract -- "$@"
ext iso|jar|msi|pkg|rar|shar|tar|tgz|xar|xpi|xz|zip, has atool = atool --extract -- "$@"

#-------------------------------------------
# Default fallback - open text-like files with neovim
#-------------------------------------------
label editor, !mime ^image, !mime ^video, !mime ^audio = nvim -- "$@"
label pager, !mime ^image, !mime ^video, !mime ^audio = "$PAGER" -- "$@"

# Final fallback
else = xdg-open "$@"
